<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deal Summary Embed</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #f3f4f6;
      --surface: #ffffff;
      --line: #e5e7eb;
      --text: #1f2937;
      --muted: #6b7280;
      --label: #374151;
      --blue: #0176d3;
      --sf-blue: #032d60;
      --green: #059669;
      --radius: 10px;
      --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --ease: cubic-bezier(.22,1,.36,1);
    }

    *{ box-sizing: border-box; }
    html, body{
      margin: 0; padding: 0;
      background: transparent;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    :focus-visible{ outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }

    .widget{
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
      overflow: hidden;
      max-width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ── LOADING ── */
    .loading-overlay {
      position: fixed; inset: 0;
      background: rgba(255,255,255,0.9);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.3s ease;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--line);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── ERROR BANNER ── */
    .error-banner {
      display: none;
      background: #fef2f2; border-bottom: 1px solid #fecaca;
      padding: 10px 20px; font-size: 14px; color: #b91c1c;
      flex-shrink: 0;
    }
    .error-banner.show { display: block; }

    /* ── SUCCESS ALERT ── */
    .success-alert{
      position: fixed; top: 20px; right: 20px;
      background: #d1fae5; border: 1px solid #6ee7b7;
      border-radius: 6px; padding: 12px 16px;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 4px 12px rgba(0,0,0,.15); z-index: 1000;
      opacity: 0; transform: translateY(-10px);
      transition: all 0.3s ease; pointer-events: none;
    }
    .success-alert.show{ opacity: 1; transform: translateY(0); pointer-events: auto; }
    .success-icon{
      width: 20px; height: 20px; background: #059669;
      border-radius: 50%; color: white; display: flex;
      align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; flex-shrink: 0;
    }
    .success-text{ font-size: 14px; color: #065f46; font-weight: 600; }

    /* ========== RECORD HEADER ========== */
    .record-header {
      position: relative;
      padding: 0;
      background: var(--surface);
      flex-shrink: 0;
      overflow: hidden;
    }

    .record-header-banner {
      position: absolute; inset: 0;
      background-image: url('https://raw.githubusercontent.com/Aliqu1233333/fffffffffffadasdx/main/Mountains.jpeg');
      background-size: cover;
      background-position: center 40%;
      filter: brightness(1.0) saturate(0.85) opacity(0.45);
    }

    .record-header-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.18) 0%,
        rgba(255, 255, 255, 0.34) 62%,
        rgba(255, 255, 255, 0.82) 92%,
        rgba(255, 255, 255, 1) 100%
      );
    }

    .record-header-content {
      position: relative;
      z-index: 1;
      padding: 20px 22px 20px;
    }

    /* Contact name */
    .record-name {
      font-size: 22.5px;
      font-weight: 700;
      color: var(--sf-blue);
      text-decoration: none;
      letter-spacing: -0.015em;
      line-height: 1.2;
      display: block;
      margin-bottom: 20px;
      transition: color 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .record-name:hover { color: var(--blue); }

    /* Metadata row */
    .record-meta {
      display: flex;
      align-items: flex-start;
      gap: 0;
      flex-wrap: wrap;
      row-gap: 10px;
    }

    .meta-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .meta-field + .meta-field {
      margin-left: 26px;
      padding-left: 26px;
      border-left: 1px solid var(--line);
    }

    .meta-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0;
      white-space: nowrap;
    }

    .meta-value {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta-value.accent { color: var(--blue); }

    /* ========== TABS ========== */
    .tabs-bar{
      display: flex; align-items: flex-end;
      gap: 28px; padding: 0 22px;
      margin-top: 15px;
      border-bottom: 1px solid var(--line);
      background: var(--surface); flex-shrink: 0;
    }
    .tab{
      appearance: none; border: 0; background: transparent;
      font-family: var(--font); font-size: 15px;
      padding: 12px 0; color: var(--muted); cursor: pointer;
      position: relative; font-weight: 500;
      transition: color 0.15s ease;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); font-weight: 600; }
    .tab.active::after{
      content: ""; position: absolute;
      left: 0; right: 0; bottom: -1px;
      height: 2px; background: var(--blue);
      border-radius: 2px 2px 0 0;
    }

    /* ========== TAB CONTENT ========== */
    .tab-content{ display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .tab-content.active{ display: flex; }

    .conversation-body{
      padding: 18px 22px 20px;
      flex: 1; overflow-y: auto;
    }

    /* ========== KEY POINTS ========== */
    .key-points-section{
      position: relative;
      overflow: hidden;
      background: #f0f7ff;
      border: 1px solid #c6ddf7;
      border-radius: 12px;
      padding: 0;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.9),
        0 1px 2px rgba(3,45,96,.07),
        0 5px 12px -6px rgba(3,45,96,.16),
        0 22px 40px -24px rgba(3,45,96,.40);
    }

    /* A single light sweep as the summary arrives — the only flourish on the page */
    .key-points-section.arrived::after{
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(105deg,
        rgba(255,255,255,0) 38%,
        rgba(255,255,255,.62) 50%,
        rgba(255,255,255,0) 62%);
      transform: translateX(-115%);
      pointer-events: none;
      animation: kpSweep 1.35s var(--ease) .08s 1 forwards;
      border-radius: 12px;
    }
    @keyframes kpSweep{ to{ transform: translateX(115%); } }

    .key-points-section.arrived .key-points-icon{
      animation: iconSettle .55s var(--ease) both;
    }
    @keyframes iconSettle{
      0%  { transform: scale(.88); opacity: 0; }
      60% { transform: scale(1.05); opacity: 1; }
      100%{ transform: scale(1); opacity: 1; }
    }
    .key-points-header{
      display: flex; align-items: center; gap: 9px;
      font-size: 14.5px; font-weight: 700;
      color: var(--sf-blue);
      letter-spacing: 0.01em;
      background: #ffffff;
      border-bottom: 1px solid #dbeafe;
      padding: 14px 18px 13px;
    }
    .key-points-icon{
      display: flex; align-items: center;
      flex-shrink: 0; line-height: 1;
      filter: drop-shadow(0 1px 2px rgba(1,118,211,.28));
    }
    .key-points-list{
      margin: 0; padding: 16px 18px 17px; list-style: none;
      background: linear-gradient(180deg, #eaf4ff 0%, #f2f8ff 100%);
      box-shadow: inset 0 3px 6px -4px rgba(3,45,96,.20);
    }
    .key-points-list li{
      position: relative;
      font-size: 15.5px;
      color: var(--text);
      line-height: 1.65;
      padding: 0 0 11px 19px;
      animation: pointIn .42s var(--ease) both;
      animation-delay: calc(var(--i, 0) * 70ms);
    }
    .key-points-list li:last-child{ padding-bottom: 0; }
    .key-points-list li::before{
      content: "";
      position: absolute; left: 2px; top: .66em;
      width: 6.5px; height: 6.5px; border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #7cc4ff 0%, #1b96ff 48%, #0166ba 100%);
      box-shadow: 0 1px 1.5px rgba(3,45,96,.30);
    }
    @keyframes pointIn{
      from{ opacity: 0; transform: translateY(4px); }
      to  { opacity: 1; transform: none; }
    }

    /* Skeleton while loading */
    .kp-skel{ padding: 0 0 11px 19px !important; animation: none !important; }
    .kp-skel::before{ display: none !important; }
    .kp-skel span{
      display: block; height: 11px; border-radius: 5px;
      background: linear-gradient(90deg, #dbeafe 25%, #eff6ff 50%, #dbeafe 75%);
      background-size: 400% 100%;
      animation: shimmerBar 1.4s linear infinite;
    }
    @keyframes shimmerBar{
      0%  { background-position: 100% 0; }
      100%{ background-position: -100% 0; }
    }

    /* ── EMPTY STATE ── */
    .empty-wrap{ display: none; text-align: center; padding: 20px 16px 12px; }
    .empty-wrap img{
      width: 100%; max-width: 499px;
      opacity: 0.92; margin-bottom: 14px;
    }
    .empty-title{
      font-size: 18px; font-weight: 700;
      color: var(--text); margin-bottom: 12px;
    }
    .empty-body{
      font-size: 14px; color: var(--muted); line-height: 1.5;
      max-width: 320px; margin: 0 auto;
    }

    /* Scrollbar */
    .conversation-body::-webkit-scrollbar { width: 5px; }
    .conversation-body::-webkit-scrollbar-track { background: transparent; }
    .conversation-body::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

    @media (max-width: 420px){
      .record-header-content{ padding: 16px 16px 14px; }
      .record-name{ font-size: 20px; }
      .tabs-bar{ padding: 0 16px; }
      .conversation-body{ padding: 16px 16px 18px; }
      .meta-field + .meta-field{ margin-left: 16px; padding-left: 16px; }
    }

    @media (prefers-reduced-motion: reduce){
      *, *::before, *::after{
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

  <div class="widget">
    <div class="error-banner" id="errorBanner">⚠ Could not load deal data.</div>

    <div class="success-alert" id="successAlert">
      <div class="success-icon">✓</div>
      <div class="success-text" id="successText">Note saved to Monday.com</div>
    </div>

    <!-- ===== RECORD HEADER ===== -->
    <div class="record-header">
      <div class="record-header-banner"></div>
      <div class="record-header-overlay"></div>
      <div class="record-header-content">

        <a href="#" class="record-name" id="contactName">Loading…</a>

        <div class="record-meta">
          <div class="meta-field">
            <span class="meta-label">Last Contact</span>
            <span class="meta-value accent" id="conversationDate">—</span>
          </div>
          <div class="meta-field">
            <span class="meta-label">Lead Status</span>
            <span class="meta-value" id="metaLeadStatus">—</span>
          </div>
          <div class="meta-field">
            <span class="meta-label">Owner Status</span>
            <span class="meta-value" id="metaOwnerStatus">—</span>
          </div>
        </div>
      </div>
    </div>

    <!-- TABS -->
    <div class="tabs-bar">
      <button class="tab active" data-tab="conversation">Last Conversation</button>
    </div>

    <!-- ===== TAB 1 ===== -->
    <div class="tab-content active" id="conversation-tab">
      <div class="conversation-body">

        <div class="key-points-section" id="keyPointsSection">
          <div class="key-points-header">
            <span class="key-points-icon">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <defs>
                  <linearGradient id="sparkMain" x1="4" y1="3" x2="20" y2="21" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#5CC8FF"/>
                    <stop offset="0.55" stop-color="#1B96FF"/>
                    <stop offset="1" stop-color="#0176D3"/>
                  </linearGradient>
                  <linearGradient id="sparkSmall" x1="17" y1="2" x2="23" y2="8" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#9BDCFF"/>
                    <stop offset="1" stop-color="#1B96FF"/>
                  </linearGradient>
                </defs>
                <path d="M10.4 2.9l1.5 4.1a2.6 2.6 0 0 0 1.6 1.6l4.1 1.5-4.1 1.5a2.6 2.6 0 0 0-1.6 1.6l-1.5 4.1-1.5-4.1a2.6 2.6 0 0 0-1.6-1.6L3.3 10.1l4.1-1.5a2.6 2.6 0 0 0 1.6-1.6l1.4-4.1z" fill="url(#sparkMain)"/>
                <path d="M18.4 14.2l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7.7-1.9z" fill="url(#sparkSmall)"/>
              </svg>
            </span>
            <span>Key Conversation Points</span>
          </div>
          <ul class="key-points-list" id="keyPointsList">
            <li class="kp-skel"><span style="width:100%"></span></li>
            <li class="kp-skel"><span style="width:93%"></span></li>
            <li class="kp-skel"><span style="width:66%"></span></li>
          </ul>
        </div>

        <div class="empty-wrap" id="noDataState">
          <img src="https://raw.githubusercontent.com/Aliqu1233333/fffffffffffadasdx/main/empty%20state%20background.jpg" alt="" />
          <div class="empty-title">No Conversation Data Added</div>
          <div class="empty-body">Once notes are added to related contacts, the AI summary will appear here.</div>
        </div>

      </div>
    </div>

  </div>

  <script>
    const LOAD_WEBHOOK_URL  = "https://hook.us1.make.com/3spufybkajebciu4vjz51fcuwlncm0e8";
    const MAKE_WEBHOOK_URL  = "https://hook.us1.make.com/wfh5ezjw929dnmyaeu8zlnt1uwl6ewkn";
    const NOTES_WEBHOOK_URL = "https://hook.us1.make.com/av1u6ziybzlgjmptgr8kvunv1goto9dy";

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      const d = document.createElement('div');
      d.textContent = String(str);
      return d.innerHTML;
    }

    function toTitleCase(str) {
      if (!str || str === '—') return str;
      return String(str).toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
    }

    function relativeTime(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d)) return '';
      const diff = Math.floor((Date.now() - d) / 86400000);
      if (diff === 0) return 'Today';
      if (diff === 1) return 'Yesterday';
      if (diff < 7)  return `${diff} Days Ago`;
      if (diff < 30) return `${Math.floor(diff/7)}w Ago`;
      return `${Math.floor(diff/30)}mo Ago`;
    }

    function statusClass(status) {
      if (!status) return 'default';
      const s = status.toLowerCase();
      if (s.includes('not interested')) return 'not-interested';
      if (s.includes('interested'))     return 'interested';
      if (s.includes('warm'))           return 'warm';
      if (s.includes('no answer') || s.includes('no-answer')) return 'no-answer';
      return 'default';
    }

    function fmtDate(dateStr) {
      if (!dateStr) return '—';
      const d = new Date(dateStr);
      if (isNaN(d)) return dateStr;
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function getMonthYear(dateStr) {
      if (!dateStr) return 'Unknown';
      const d = new Date(dateStr);
      if (isNaN(d)) return dateStr;
      return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }

    let src = {};

    function renderAll() {
      // Record header
      const nameEl = document.getElementById('contactName');
      nameEl.textContent = toTitleCase(src.contact_name || '') || '—';
      nameEl.href = src.contact_url || src.item_url || '#';

      const dateStr = fmtDate(src.conv_date);
      const rel     = relativeTime(src.conv_date);
      document.getElementById('conversationDate').textContent = rel || dateStr;

      document.getElementById('metaLeadStatus').textContent   = toTitleCase(src.lead_status  || '—');
      document.getElementById('metaOwnerStatus').textContent  = toTitleCase(src.owner_status || '—');

      // Key points
      const kpRaw = src.key_points || '';
      const kp = Array.isArray(kpRaw)
        ? kpRaw
        : kpRaw.split('|').map(s => s.trim()).filter(Boolean);

      if (kp.length) {
        const section = document.getElementById('keyPointsSection');
        section.style.display = '';
        document.getElementById('noDataState').style.display = 'none';
        document.getElementById('keyPointsList').innerHTML =
          kp.map((p, i) => `<li style="--i:${i}">${escapeHtml(p)}</li>`).join('');
        section.classList.add('arrived');
      } else {
        document.getElementById('keyPointsSection').style.display = 'none';
        document.getElementById('noDataState').style.display      = 'block';
      }
    }

    async function loadDealData() {
      const raw    = window.location.search.replace('?', '');
      const params = new URLSearchParams(window.location.search);
      let item_id  = params.get('item_id') || params.get('pulseId') || null;
      let board_id = params.get('board_id') || params.get('boardId') || '';

      if (!item_id) { const m = raw.match(/(\d+)\/pulses\/(\d+)/);  if (m) { board_id=m[1]; item_id=m[2]; } }
      if (!item_id) { const m = raw.match(/(\d+)\/item_id=(\d+)/);  if (m) { board_id=m[1]; item_id=m[2]; } }
      if (!item_id) { const m = raw.match(/(\d+)\/(\d+)/);          if (m) { board_id=m[1]; item_id=m[2]; } }

      if (!item_id) { src = {}; renderAll(); return; }

      try {
        const res = await fetch(LOAD_WEBHOOK_URL, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ item_id, board_id })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        try {
          src = JSON.parse(text);
        } catch(parseErr) {
          src = {}; renderAll(); return;
        }
        // Always stamp item_id and board_id from URL — never trust webhook to return them
        src.item_id  = item_id;
        src.board_id = board_id;
        renderAll();
      } catch(err) {
        src = { item_id, board_id }; renderAll();
      }
    }

    function showSuccess(msg) {
      document.getElementById('successText').textContent = msg;
      const el = document.getElementById('successAlert');
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById(`${tab.dataset.tab}-tab`).classList.add('active');
      });
    });

    loadDealData().finally(() => {
      const ov = document.getElementById('loadingOverlay');
      ov.classList.add('hidden');
      setTimeout(() => ov.remove(), 400);
    });
  </script>
</body>
</html>
